<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>6. 문제: 모달 열기/닫기</title>
  </head>
  <body>
    <div>
      설명: 버튼을 클릭하면 모달을 열고, 모달 안의 버튼을 클릭하면 모달을
      닫습니다.
    </div>

    <button id="openModalButton">모달 열기</button>
    <div id="modal" style="display: none">
      <div>모달 내용</div>
      <button id="closeModalButton">닫기</button>
    </div>

    <script>
      const openButtonEl = document.querySelector("#openModalButton");
      const closeButtonEl = document.querySelector("#closeModalButton");
      const modal = document.querySelector("#modal");
      openButtonEl.addEventListener("click", function () {
        modal.style.display = "block";
      });

      closeButtonEl.addEventListener("click", function () {
        modal.style.display = "none";
      });
    </script>
  </body>
</html>
