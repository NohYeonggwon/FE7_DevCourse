<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1. 문제: 버튼 클릭 시 텍스트 변경</title>
  </head>
  <body>
    <div>버튼을 클릭하면 특정 p태그의 텍스트를 변경합니다.</div>

    <p id="text">원래 텍스트</p>
    <button id="changeTextButton">텍스트 변경</button>

    <script>
      const buttonEl = document.querySelector("button");

      buttonEl.addEventListener("click", function () {
        const pEl = document.querySelector("p");
        if (pEl.innerText === "원래 텍스트") {
          pEl.innerText = "새로운 텍스트";
        } else pEl.innerText = "원래 텍스트";
      });
    </script>
  </body>
</html>
