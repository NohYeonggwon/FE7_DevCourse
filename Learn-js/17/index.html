<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>이벤트</h1>
    <button>클릭</button>
    <script>
      const target = document.querySelector("button");

      // 이벤트 타입(click)
      target.addEventListener("click", function () {
        console.log("클릭");
      });
      // mouseover => mouseenter
      // mouseout => mouseleave
    </script>
  </body>
</html>
